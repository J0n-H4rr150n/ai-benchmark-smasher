version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ctf_smasher
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf_smasher"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ctf:ctf_password_change_in_prod@db:5432/ctf_smasher
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/vertex-executor-key.json
    volumes:
      - ./api:/app/api
      - ./vertex-executor-key.json:/app/vertex-executor-key.json:ro
      - playwright_state:/app/.playwright
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  playwright_state:
